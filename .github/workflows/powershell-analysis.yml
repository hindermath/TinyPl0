name: PowerShell Static Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the expensive cross-platform canary on the three public reference
        # repositories. Distributed/private fleet copies use Linux continuously.
        os: ${{ fromJSON(contains(fromJSON('["hindermath/home-baseline","hindermath/agent-operations-cockpit","hindermath/TuiVision"]'), github.repository) && '["ubuntu-22.04","macos-14","windows-2022"]' || '["ubuntu-22.04"]') }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install required PowerShell modules
        shell: pwsh
        run: ./scripts/maintain-powershell-modules.ps1

      - name: Analyze tracked PowerShell files
        shell: pwsh
        run: ./scripts/invoke-psscriptanalyzer.ps1

  baseline-parity:
    name: Baseline parity (${{ matrix.os }}, ${{ matrix.surface }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            surface: powershell
          - os: ubuntu-22.04
            surface: powershell
          - os: windows-2022
            surface: powershell
          - os: macos-14
            surface: bash
          - os: ubuntu-22.04
            surface: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate PowerShell baseline
        if: matrix.surface == 'powershell'
        shell: pwsh
        run: ./scripts/build-secure-development-docs.ps1 -Check

      - name: Validate Bash baseline
        if: matrix.surface == 'bash'
        shell: bash
        run: bash ./scripts/build-secure-development-docs.sh --check
