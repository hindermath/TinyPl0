name: Gitleaks

on:
  push:
  pull_request:

# DE: Nur lesender Checkout; unbenannte Token-Rechte bleiben gesperrt.
# EN: Read-only checkout; unspecified token permissions remain disabled.
permissions:
  contents: read

jobs:
  gitleaks:
    # DE/EN: Preserve existing PR review comments without repository content writes.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
